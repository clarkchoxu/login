<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credits - Flash Card Quiz</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    color: #f5f5f5;
  }

  .card {
    background: #1e293b;
    border-radius: 20px;
    padding: 40px 60px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
    animation: fadeUp .6s ease;
  }

  @keyframes fadeUp {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  h1 {
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 2.5rem; margin-bottom: 20px;
  }

  ul {
    list-style: none; padding: 0; margin: 0;
  }

  li {
    font-size: 1.25rem; margin: 10px 0;
    color: #e2e8f0; font-weight: 500;
  }

  a {
    display: inline-block;
    margin-top: 30px;
    text-decoration: none;
    background: linear-gradient(135deg, #3b82f6, #1e40af);
    color: white; padding: 12px 32px;
    border-radius: 12px;
    transition: 0.3s;
    font-weight: 600;
  }

  a:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(59,130,246,0.4); }
</style>
</head>
<body>
  <div class="card">
    <h1>Credits</h1>
    <ul>
      <li>Clark Santos</li>
      <li>Josh Ian Mosquito</li>
      <li>James Derilo</li>
      <li>Clark Santiago</li>
      <li>Cian Garcia</li>
    </ul>
    <a href="index.html"> Back to Home</a>
  </div>
</body>
</html>
