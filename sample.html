<!DOCTYPE html>
<html lang="en">
  <link rel="stylesheet" href="ham_menu.css">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flash Card Quiz</title>
  <style>
/* ===== CSS Variables ===== */
/* ===== CSS Variables ===== */
:root {
  --primary-color: #6366f1;
  --primary-dark: #4f46e5;
  --success-color: #10b981;
  --success-light: #d1fae5;
  --success-dark: #065f46;
  --error-color: #ef4444;
  --error-light: #fee2e2;
  --neutral-100: #f5f5f5;
  --neutral-200: #e5e5e5;
  --neutral-300: #d4d4d4;
  --neutral-900: #171717;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  --border-radius-sm: 8px;
  --border-radius-md: 12px;
  --border-radius-lg: 16px;
  --transition-fast: 150ms ease;
  --transition-normal: 300ms ease;
  --transition-slow: 500ms ease;
  --card-ratio: 4;
}

/* ===== Decorations ===== */
.decoration {
  position: absolute;
  border-radius: 50%;
  opacity: 0.08;
  animation: float 6s ease-in-out infinite;
  z-index: 0;
  pointer-events: none;
}

.dec-1 {
  width: 250px;
  height: 250px;
  background: white;
  bottom: 200px;
  left: 200px;
}

.dec-2 {
  width: 200px;
  height: 200px;
  background: white;
  bottom: 200px;
  right: -70px;
  animation-delay: 2s;
}

.dec-3 {
  width: 150px;
  height: 150px;
  background: white;
  top: calc(50% - 355px);
  right: 10%;
  animation-delay: 4s;
}

@keyframes float {
  0%, 100% { transform: translate3d(0, 0, 0); }
  50% { transform: translate3d(0, -20px, 0); }
}

/* ===== Reset & Body ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  display: flex;
  flex-direction: column; 
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 16px;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #334155 100%);
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
  pointer-events: none;
}

/* ===== Timer ===== */
.timer {
  position: fixed;
  top: 4px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5rem;
  font-weight: 700;
  background: white;
  color: var(--neutral-900);
  padding: 12px 28px;
  border-radius: var(--border-radius-lg);
  box-shadow: var(--shadow-lg);
  z-index: 1000;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  letter-spacing: 0.5px;
  animation: slideDown 0.5s ease;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
}

/* ===== Summary Card ===== */
.summary-card {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: white;
  border-radius: var(--border-radius-lg);
  padding: 32px;
  box-shadow: var(--shadow-xl);
  overflow-y: auto;
  display: none;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.summary-card::-webkit-scrollbar {
  width: 8px;
}
.summary-card::-webkit-scrollbar-track {
  background: var(--neutral-100);
}
.summary-card::-webkit-scrollbar-thumb {
  background: var(--neutral-300);
  border-radius: 4px;
}
.summary-card::-webkit-scrollbar-thumb:hover {
  background: var(--primary-color);
}

.summary-card h2 {
  text-align: center;
  margin-bottom: 24px;
  color: var(--neutral-900);
  font-size: 2rem;
  font-weight: 800;
}

.summary-card .question-summary {
  margin-bottom: 16px;
  padding: 16px;
  border: 2px solid var(--neutral-200);
  border-radius: var(--border-radius-md);
  background: var(--neutral-100);
  transition: all var(--transition-normal);
}

.summary-card .question-summary:hover {
  border-color: var(--primary-color);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.summary-card .question-summary p {
  margin: 8px 0;
  line-height: 1.6;
}

.summary-card .correct-answer {
  color: var(--success-color);
  font-weight: 700;
  padding: 2px 6px;
  background: var(--success-light);
  border-radius: 4px;
}

.summary-card .wrong-answer {
  color: var(--error-color);
  font-weight: 700;
  text-decoration: line-through;
  padding: 2px 6px;
  background: var(--error-light);
  border-radius: 4px;
}

/* ===== Stack (card container) ===== */
.stack {
  position: relative;
  width: min(420px, 90vw);
  aspect-ratio: 3 / var(--card-ratio);
  max-width: 480px;
  perspective: 1200px;
  margin: 0 auto;
  z-index: 1;
}

/* ===== Card ===== */
.card {
  position: absolute;
  inset: 0;
  background: white;
  border-radius: var(--border-radius-lg);
  padding: 24px;
  transition:
    transform var(--transition-slow) cubic-bezier(0.34, 1.56, 0.64, 1),
    opacity var(--transition-slow) ease,
    box-shadow var(--transition-normal) ease;
  box-shadow: var(--shadow-xl);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--primary-color), var(--primary-dark));
  border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
}

.card:hover {
  box-shadow: var(--shadow-xl), 0 0 0 2px var(--primary-color);
}

.card.hide {
  transform: translateX(-150%) rotate(-15deg);
  opacity: 0;
  pointer-events: none;
}

.card img {
  width: 100%;
  height: auto;
  max-height: 40%;
  object-fit: contain;
  margin-bottom: 16px;
  border-radius: var(--border-radius-md);
  box-shadow: var(--shadow-sm);
}

.question {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--neutral-900);
  text-align: center;
}

/* ===== Choices ===== */
.choices {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.choices button {
  padding: 16px 22px;
  width: 100%;
  font-size: 1.05rem;
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--border-radius-md);
  border: 2px solid var(--neutral-200);
  background: white;
  color: var(--neutral-900);
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
  text-align: left;
  box-shadow: var(--shadow-sm);
}

.choices button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.1), transparent);
  transition: left 0.6s ease;
}

.choices button::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 12px;
  width: 6px;
  height: 6px;
  background: var(--primary-color);
  border-radius: 50%;
  transform: translateY(-50%) scale(0);
  transition: transform var(--transition-normal);
}

.choices button:hover:not(.answered) {
  border-color: var(--primary-color);
  background: linear-gradient(135deg, #f0f2ff 0%, #ffffff 100%);
  transform: translateX(6px);
  box-shadow: var(--shadow-md);
}

.choices button:hover:not(.answered)::before {
  left: 100%;
}

.choices button:hover:not(.answered)::after {
  transform: translateY(-50%) scale(1);
}

.choices button.correct {
  background: linear-gradient(135deg, var(--success-light) 0%, #f0fdf7 100%);
  border-color: var(--success-color);
  color: var(--success-dark);
  animation: correctPulse 0.6s ease;
  box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1), var(--shadow-md);
}

.choices button.correct::after {
  content: '✓';
  width: auto;
  height: auto;
  background: none;
  font-size: 1.2rem;
  color: var(--success-color);
  transform: translateY(-50%) scale(1);
  font-weight: bold;
}

@keyframes correctPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.choices button.wrong {
  background: linear-gradient(135deg, var(--error-light) 0%, #ffffff 100%);
  border-color: var(--error-color);
  color: var(--error-color);
  animation: wrongShake 0.5s ease;
}

@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.choices button.answered {
  cursor: not-allowed;
  opacity: 0.9;
}

/* ===== Responsive Design ===== */
@media (max-width: 480px) {
  .timer {
    font-size: 1.25rem;
    padding: 10px 20px;
  }
  .question { font-size: 1.1rem; }
  .choices button {
    padding: 12px 16px;
    font-size: 0.95rem;
  }
  .stack { width: 94vw; }
  .card { padding: 20px; }
  .summary-card { padding: 20px; }
  .summary-card h2 { font-size: 1.5rem; }
}

@media (max-width: 360px) {
  .timer {
    font-size: 1.1rem;
    padding: 8px 16px;
  }
  .question { font-size: 1rem; }
  .choices button {
    padding: 10px 14px;
    font-size: 0.9rem;
  }
  .card { padding: 16px; }
}

/* ===== Print Styles ===== */
@media print {
  body { background: white; }
  .timer { position: static; transform: none; }
  .card { page-break-inside: avoid; }
}

  </style>

  
</head>
<body>

  <div class="off_screen_menu">
    <ul>
        <li data-submenu="Home">Home</li>
        <li data-submenu="Retry">Retry</li>
        <li data-submenu="Credits">Credits</li>
    </ul>
</div>

<div class="black"></div>

<nav>
    <div class="ham_menu">
        <span></span>
        <span></span>
        <span></span>
    </div>


  <div class="decoration dec-1"></div>
  <div class="decoration dec-2"></div>
  <div class="decoration dec-3"></div>





  <div class="timer" id="timer">00:00</div>
  <div class="stack" id="cardStack">
    <div class="summary-card" id="summaryCard"></div>
  </div>





  <script>
  const stack = document.getElementById('cardStack');
  const timerElement = document.getElementById('timer');
  const summaryCard = document.getElementById('summaryCard');
  let correctCount = 0;
  let wrongCount = 0;
  let answeredCount = 0;
  let questions = [];
  let startTime;
  let timerInterval;
  let userAnswers = [];
  
  // Function to add a new question
  function addQuestion(question, choices, answer) {
    if (choices.length > 6) {
      console.error('Maximum 6 choices allowed per question');
      return;
    }
    questions.push({ question, choices, answer });
  }

  // Function to update card ratio based on number of choices
  function updateCardRatio(choicesCount) {
    const baseRatio = 3.5; // base aspect ratio
    const ratioPerChoice = 0.4; // additional ratio per choice
    const ratio = baseRatio + (ratioPerChoice * choicesCount);
    document.documentElement.style.setProperty('--card-ratio', ratio.toString());
  }

  // Add your questions here
  addQuestion("ANSWER?", ["A", "B", "C", "D", "E"], "C");
  addQuestion("ANSWER?", ["A", "B", "C", "D", "E"], "C");
  addQuestion("ANSWER?", ["A", "B", "C", "D"], "D");
  addQuestion("ANSWER?", ["1", "2", "3", "4", "5", "6"], "6");
  addQuestion("ANSWER?", ["A", "B", "C", "D"], "C");
  addQuestion("ANSWER?", ["A", "B", "C", "D"], "C");
  addQuestion("ANSWER?", ["A", "B", "C", "D"], "B");
  addQuestion("ANSWER?", ["A", "B", "C", "D"], "A");
  addQuestion("ANSWER?", ["A", "B", "C", "D"], "C");
  addQuestion("ANSWER?", ["A", "B", "C", "D", "E"], "A");


  const totalQuestions = questions.length; // responsive to list length
  const cards = [];

  // Start the timer when questions are loaded
  startTimer();

  questions.slice().reverse().forEach((q, i) => {
    updateCardRatio(q.choices.length); // Update card ratio based on number of choices
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = `questionaire/Q${questions.length - i}.jpg`;
    img.alt = `Question ${questions.length - i} image`;
    
    const questionEl = document.createElement('div');
    questionEl.className = 'question';
    questionEl.textContent = q.question;

    const choicesEl = document.createElement('div');
    choicesEl.className = 'choices';

    q.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.textContent = choice;
      btn.addEventListener('click', () => {
        if (btn.classList.contains('answered') || card.dataset.completed === 'true') return;

        btn.classList.add('answered');
        card.dataset.completed = 'true'; // Mark this card as completed
        answeredCount++;

        // Store the user's answer
        userAnswers[questions.length - 1 - i] = btn.textContent;
        
        if (btn.textContent === q.answer) {
            btn.classList.add('correct');
            correctCount++;
            const cd = document.getElementById('correctCount');
            if (cd) cd.textContent = correctCount;
        } else {
            btn.classList.add('wrong');
            wrongCount++;
            const wd = document.getElementById('wrongCount');
            if (wd) wd.textContent = wrongCount;
        }

        setTimeout(() => {
            card.classList.add('hide');
            if (answeredCount < totalQuestions) {
            setTimeout(() => {
                // Only reshuffle if not completed
                if (card.dataset.completed !== 'true') {
                card.classList.remove('hide');
                stack.appendChild(card);
                cards.push(cards.shift());
                updateZIndex();
                }
                [...choicesEl.children].forEach(b => {
                b.classList.remove('correct', 'wrong', 'answered');
                });
            }, 600);
            } else {
            showFinalScore();
            }
        }, 300);
      });

      choicesEl.appendChild(btn);
    });

    card.appendChild(img);
    card.appendChild(questionEl);
    card.appendChild(choicesEl);
    stack.appendChild(card);
    cards.unshift(card);
  });

  function updateZIndex() {
    cards.forEach((card, index) => {
      card.style.zIndex = totalQuestions - index;
    });
  }

  // Timer functions
  function startTimer() {
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
  }

  function updateTimer() {
    const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
    const minutes = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
    const seconds = (elapsedTime % 60).toString().padStart(2, '0');
    timerElement.textContent = `${minutes}:${seconds}`;
  }

  function stopTimer() {
    clearInterval(timerInterval);
    return timerElement.textContent;
  }

  function showFinalScore() {
    const finalTime = stopTimer();
    
    // Create summary content
    let summaryHTML = `
      <h2>🎉 Quiz Summary</h2>
      <div class="question-summary">
        <p>⏱️ Time taken: ${finalTime}</p>
        <p>✅ Correct answers: ${correctCount}</p>
        <p>❌ Wrong answers: ${wrongCount}</p>
      </div>
    `;

    // Add individual question summaries
    userAnswers.forEach((answer, index) => {
      const question = questions[index];
      summaryHTML += `
        <div class="question-summary">
          <p><strong>Question ${index + 1}:</strong> ${question.question}</p>
          <p>Your answer: <span class="${answer === question.answer ? 'correct-answer' : 'wrong-answer'}">${answer}</span></p>
          ${answer !== question.answer ? `<p>Correct answer: <span class="correct-answer">${question.answer}</span></p>` : ''}
        </div>
      `;
    });

    // Display summary card
    // Save best time (in seconds) to localStorage under the same key index.html reads
    try {
      // finalTime is formatted as MM:SS (e.g. "01:23")
      const parts = finalTime.split(':').map(p => Number(p));
      const seconds = (Number.isFinite(parts[0]) ? parts[0] : 0) * 60 + (Number.isFinite(parts[1]) ? parts[1] : 0);
      const BEST_TIME_KEY = 'cardquiz.bestTime';
      const raw = localStorage.getItem(BEST_TIME_KEY);
      const prev = raw ? Number(raw) : null;
      let newBest = false;
      if (prev === null || Number.isNaN(prev) || seconds < prev) {
        localStorage.setItem(BEST_TIME_KEY, String(seconds));
        newBest = true;
      }
      if (newBest) {
        summaryHTML += `<div style="margin-top:12px;font-weight:800;color:#065f46">🎉 New best time!</div>`;
      }

    } catch (err) {
      // localStorage may be unavailable in some environments; fail silently
      console.warn('Could not save best time:', err);
    }

    summaryCard.innerHTML = summaryHTML;
    summaryCard.style.display = 'block';
  }

  updateZIndex();

  
const hamburger = document.querySelector('.ham_menu');
const offScreenMenu = document.querySelector('.off_screen_menu');
const black = document.querySelector('.black');
hamburger.addEventListener('click', () => {
hamburger.classList.toggle('active');
offScreenMenu.classList.toggle('active');
black.classList.toggle('active');
}); 

document.addEventListener('DOMContentLoaded', () => {

    const homeMenu = document.querySelector('[data-submenu="Home"]');
    const retryMenu = document.querySelector('[data-submenu="Retry"]');
    const creditsMenu = document.querySelector('[data-submenu="Credits"]'); // Make sure this is "Music" based on your HTML

    // When "Home" is clicked, go to home.html
    homeMenu.addEventListener('click', () => {
        window.location.href = "index.html";
    });

    // When "Retry" is clicked, go to retry.html
    retryMenu.addEventListener('click', () => {
        window.location.href = "sample.html";
    });

    // When "Music" is clicked, go to credits.html
    creditsMenu.addEventListener('click', () => {
        window.location.href = "credits.html";
    });
});


  </script>

</body>
</html>
