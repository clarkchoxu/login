<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flash Card Quiz - Home</title>
  <style>
    :root {
       --primary-color: #3b82f6;
      --primary-dark: #1e40af;
      --primary-light: #60a5fa;
      --accent-color: #06b6d4;
      --success-color: #10b981;
      --neutral-100: #f5f5f5;
      --neutral-900: #0f172a;
      --dark-bg: #0f172a;
      --dark-card: #1e293b;
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
  position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Floating animation */
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    /* Decorative elements */
    .decoration {
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
      animation: float 6s ease-in-out infinite;
    }

    .decoration:nth-child(1) {
      width: 300px;
      height: 300px;
      background: white;
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .decoration:nth-child(2) {
      width: 200px;
      height: 200px;
      background: white;
      bottom: -50px;
      right: -50px;
      animation-delay: 2s;
    }

    .decoration:nth-child(3) {
      width: 150px;
      height: 150px;
      background: white;
      top: 50%;
      right: 10%;
      animation-delay: 4s;
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
      max-width: 450px;
      width: 90%;
    }

    /* Card */
    .welcome-card {
      background: white;
      border-radius: 24px;
      padding: 60px 40px;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.8s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Icon */
    .icon {
      font-size: 50px;
      margin-bottom: 10px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    /* Title */
    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      line-height: 1.0;
    }

    /* Subtitle */
    .subtitle {
      font-size: 1rem;
      color: #666;
      margin-bottom: 5px;
      font-weight: 500;
    }

    /* Stats */
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-color);
      display: block;
    }

    .stat-label {
      font-size: 0.875rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Instructions */
    .instructions {
      background: linear-gradient(135deg, #f0f0ff 0%, #fff5f5 100%);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 30px;
      text-align: left;
    }

    .instructions h3 {
      font-size: 1.125rem;
      color: var(--neutral-900);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .instructions ul {
      list-style: none;
      padding: 0;
    }

    .instructions li {
      padding: 8px 0;
      color: #555;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .instructions li::before {
      content: '✓';
      color: var(--success-color);
      font-weight: bold;
      font-size: 1.25rem;
    }

    /* Start button */
    .start-button {
      display: inline-block;
      padding: 18px 48px;
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border: none;
      border-radius: 16px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .start-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .start-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
    }

    .start-button:hover::before {
      left: 100%;
    }

    .start-button:active {
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .welcome-card {
        padding: 40px 24px;
      }

      h1 {
        font-size: 2rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .icon {
        font-size: 60px;
      }

      .stats {
        gap: 20px;
      }

      .stat-number {
        font-size: 1.5rem;
      }

      .start-button {
        padding: 6px 40px;
        font-size: 1.125rem;
      }

      .instructions {
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.75rem;
      }

      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="decoration"></div>
  <div class="decoration"></div>
  <div class="decoration"></div>

  <div class="container">
    <div class="welcome-card">
      <div class="icon">💡</div>
      
      <h1>Card Quiz</h1>
      <p class="subtitle">Test your knowledge and challenge yourself!</p>

      <div class="stats">
        <div class="stat-item">
          <span class="stat-number">10</span>
          <span class="stat-label">Questions</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">∞</span>
          <span class="stat-label">Attempts</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">⏱</span>
          <span class="stat-label">Timed</span>
        </div>
      </div>


      <div class="instructions">
        <h3>How to Play:</h3>
        <ul>
          <li>Select your answer from the choices</li>
          <li>Cards will flip to reveal the next question</li>
          <li>Complete all questions to see your score</li>

        </ul>
      </div>
      <a href="sample.html" class="start-button">Start Quiz </a>
    </div>
    
  </div>
</body>
</html>
